<li class="publication">
  <span class="publication-year">{{ paper.year | default: 'Report' }}</span>
  <div>
    <h3>{% if paper.doi %}<a href="{{ paper.doi | escape }}">{{ paper.title | escape }}</a>{% else %}{{ paper.title | escape }}{% endif %}</h3>
    <p class="publication-meta">{{ paper.journal | escape }} · {{ paper.role | escape }}</p>
    {% if paper.doi %}<a class="text-link paper-link" href="{{ paper.doi | escape }}" aria-label="Read {{ paper.title | escape }}">Read paper <span aria-hidden="true">↗</span></a>{% endif %}
    {% if paper.pdf %}<a class="text-link paper-link" href="{{ paper.pdf | relative_url }}">PDF</a>{% endif %}
  </div>
</li>
