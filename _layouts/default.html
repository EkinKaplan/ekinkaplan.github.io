<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="site-shell">
  <header class="site-header">
    <a class="wordmark" href="{{ '/' | relative_url }}">{{ site.data.profile.name | escape }}</a>
    <nav aria-label="Main navigation">
    {% for item in site.data.navigation %}
      <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title | escape }}</a>
    {% endfor %}
    </nav>
  </header>
  <main id="main">{{ content }}</main>
  <footer class="site-footer">
    <div><span class="footer-name">{{ site.data.profile.name | escape }}</span><span>{{ site.data.profile.location | escape }}</span></div>
    <nav aria-label="Contact and academic profiles">
      <a href="mailto:{{ site.data.profile.email | escape }}">Email</a>
      <a href="{{ site.data.profile.scholar | escape }}">Google Scholar</a>
      <a href="{{ site.data.profile.orcid | escape }}">ORCID</a>
      <a href="{{ site.data.profile.github | escape }}">GitHub</a>
    </nav>
  </footer>
</div>
</body>
</html>
